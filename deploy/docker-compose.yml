services:
  postgres:
    image: postgres:17
    container_name: surebet-postgres
    environment:
      POSTGRES_DB: surebet
      POSTGRES_USER: surebet
      POSTGRES_PASSWORD: surebet
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surebet -d surebet"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: surebet-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ../backend
      target: api
    container_name: surebet-backend-api
    environment:
      APP_NAME: surebet-platform
      APP_ENV: development
      HTTP_ADDRESS: :8080
      REDIS_ADDRESS: redis:6379
      ODDS_STATE_PROTOCOL: ${ODDS_STATE_PROTOCOL:-v1}
      POSTGRES_DSN: postgres://surebet:surebet@postgres:5432/surebet?sslmode=disable
      AUTO_BET_MODE: ${AUTO_BET_MODE:-off}
      AUTO_BET_TOTAL_STAKE_VND: ${AUTO_BET_TOTAL_STAKE_VND:-100000}
      COLLECTOR_STREAM_AUTH_REQUIRED: ${COLLECTOR_STREAM_AUTH_REQUIRED:-false}
      JUN88_ACCOUNT_ID: ${JUN88_ACCOUNT_ID:-}
      EIGHTXBET_ACCOUNT_ID: ${EIGHTXBET_ACCOUNT_ID:-}
      COLLECTOR_STREAM_JUN88_TOKEN: ${COLLECTOR_STREAM_JUN88_TOKEN:-}
      COLLECTOR_STREAM_EIGHTXBET_TOKEN: ${COLLECTOR_STREAM_EIGHTXBET_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  laravel-cli:
    build:
      context: ../laravel
    container_name: surebet-laravel-cli
    profiles:
      - tools
    environment:
      APP_NAME: "Surebet Data Tools"
      APP_ENV: local
      APP_KEY: base64:wrSe80jPSZVHw+HaX0TLgZSwtJcA+6/NXZypXD7vaq4=
      APP_DEBUG: "true"
      APP_TIMEZONE: Asia/Ho_Chi_Minh
      APP_LOCALE: vi
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: surebet
      DB_USERNAME: surebet
      DB_PASSWORD: surebet
      ODDS_RETENTION_ACTIVE_HOURS: "24"
      ODDS_RETENTION_FINISHED_MINUTES: "30"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "list"]

volumes:
  postgres-data:
  redis-data:
