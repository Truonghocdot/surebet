x-public-dns: &public-dns
  - 1.1.1.1
  - 8.8.8.8

x-collector-environment: &collector-environment
  BACKEND_API_URL: http://backend-api:8080
  COLLECTOR_HEADLESS: ${COLLECTOR_HEADLESS:-true}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    dns: *public-dns
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_FRONTEND: ${DOMAIN_FRONTEND}
      DOMAIN_API: ${DOMAIN_API}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend-api

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.prod
      target: api
    restart: unless-stopped
    dns: *public-dns
    environment:
      APP_NAME: ${BACKEND_APP_NAME}
      APP_ENV: ${BACKEND_APP_ENV}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      COLLECTOR_STREAM_AUTH_REQUIRED: ${COLLECTOR_STREAM_AUTH_REQUIRED:-true}
      JUN88_ACCOUNT_ID: ${JUN88_ACCOUNT_ID}
      EIGHTXBET_ACCOUNT_ID: ${EIGHTXBET_ACCOUNT_ID}
      COLLECTOR_STREAM_JUN88_TOKEN: ${COLLECTOR_STREAM_JUN88_TOKEN}
      COLLECTOR_STREAM_EIGHTXBET_TOKEN: ${COLLECTOR_STREAM_EIGHTXBET_TOKEN}
      HTTP_ADDRESS: :8080
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT}
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_ADDRESS: redis:6379
      REDIS_DB: "0"
      ODDS_STATE_PROTOCOL: ${ODDS_STATE_PROTOCOL:-v1}
      EIGHTXBET_BASE_URL: ${EIGHTXBET_BASE_URL}
      EIGHTXBET_INPLAY_PAGE_URL: ${EIGHTXBET_INPLAY_PAGE_URL}
      JUN88_BASE_URL: ${JUN88_BASE_URL}
      JUN88_CMD_PAGE_URL: ${JUN88_CMD_PAGE_URL}
      SUREBET_VERIFICATION_MODE: ${SUREBET_VERIFICATION_MODE:-auto}
      SUREBET_CONFIRM_TIMEOUT: ${SUREBET_CONFIRM_TIMEOUT:-2s}
      SUREBET_CONFIRM_VALIDITY: ${SUREBET_CONFIRM_VALIDITY:-2s}
      SUREBET_CONFIRM_MAX_SKEW: ${SUREBET_CONFIRM_MAX_SKEW:-1s}
      SUREBET_SHADOW_DURATION: ${SUREBET_SHADOW_DURATION:-30m}
      SUREBET_SHADOW_MIN_SAMPLES: ${SUREBET_SHADOW_MIN_SAMPLES:-20}
      SUREBET_SHADOW_MIN_SUCCESS_RATE: ${SUREBET_SHADOW_MIN_SUCCESS_RATE:-0.80}
      SUREBET_SHADOW_MAX_P95_LATENCY: ${SUREBET_SHADOW_MAX_P95_LATENCY:-1500ms}
      AUTO_BET_MODE: ${AUTO_BET_MODE:-off}
      AUTO_BET_TOTAL_STAKE_VND: ${AUTO_BET_TOTAL_STAKE_VND:-100000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      args:
        NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
        NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL}
    restart: unless-stopped
    dns: *public-dns
    environment:
      BACKEND_API_URL: ${FRONTEND_BACKEND_API_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      AUTO_BET_MODE: ${AUTO_BET_MODE:-off}
      AUTO_BET_TOTAL_STAKE_VND: ${AUTO_BET_TOTAL_STAKE_VND:-100000}
      NEXT_PUBLIC_BACKEND_API_URL: ${NEXT_PUBLIC_BACKEND_API_URL}
      NEXT_PUBLIC_BACKEND_WS_URL: ${NEXT_PUBLIC_BACKEND_WS_URL}
    depends_on:
      - backend-api

  laravel-cli:
    build:
      context: ../../laravel
    profiles:
      - tools
    dns: *public-dns
    environment:
      APP_ENV: ${LARAVEL_APP_ENV}
      APP_TIMEZONE: ${LARAVEL_APP_TIMEZONE}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SEED_FRONTEND_USER_ID: ${SEED_FRONTEND_USER_ID}
      SEED_FRONTEND_USER_EMAIL: ${SEED_FRONTEND_USER_EMAIL}
      SEED_FRONTEND_USER_PASSWORD: ${SEED_FRONTEND_USER_PASSWORD}
      SEED_FRONTEND_USER_FULL_NAME: ${SEED_FRONTEND_USER_FULL_NAME}
      SEED_FRONTEND_USER_ROLE: ${SEED_FRONTEND_USER_ROLE}
      SEED_SUPER_ADMIN_ID: ${SEED_SUPER_ADMIN_ID}
      SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD}
      SEED_SUPER_ADMIN_FULL_NAME: ${SEED_SUPER_ADMIN_FULL_NAME}
      SEED_SUPER_ADMIN_ROLE: ${SEED_SUPER_ADMIN_ROLE}
      ODDS_RETENTION_ACTIVE_HOURS: ${ODDS_RETENTION_ACTIVE_HOURS}
      ODDS_RETENTION_FINISHED_MINUTES: ${ODDS_RETENTION_FINISHED_MINUTES}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["php", "artisan", "list"]

  collector-8xbet:
    build:
      context: ../../collector
    restart: unless-stopped
    init: true
    shm_size: 1gb
    dns: *public-dns
    environment:
      <<: *collector-environment
      COLLECTOR_ACCOUNT_ID: ${EIGHTXBET_ACCOUNT_ID}
      COLLECTOR_STREAM_TOKEN: ${COLLECTOR_STREAM_EIGHTXBET_TOKEN}
      EIGHTXBET_LOGIN_USERNAME: ${EIGHTXBET_LOGIN_USERNAME:-}
      EIGHTXBET_LOGIN_PASSWORD: ${EIGHTXBET_LOGIN_PASSWORD:-}
    volumes:
      - collector-tmp:/app/collector/tmp
    depends_on:
      - backend-api
    command: ["pnpm", "run", "run:8xbet-worker"]

  collector-jun88-cmd:
    build:
      context: ../../collector
    restart: unless-stopped
    init: true
    shm_size: 1gb
    dns: *public-dns
    environment:
      <<: *collector-environment
      COLLECTOR_ACCOUNT_ID: ${JUN88_ACCOUNT_ID}
      COLLECTOR_STREAM_TOKEN: ${COLLECTOR_STREAM_JUN88_TOKEN}
      JUN88_LOGIN_USERNAME: ${JUN88_LOGIN_USERNAME:-}
      JUN88_LOGIN_PASSWORD: ${JUN88_LOGIN_PASSWORD:-}
    volumes:
      - collector-tmp:/app/collector/tmp
    depends_on:
      - backend-api
    command: ["pnpm", "run", "run:jun88-cmd-worker"]

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  collector-tmp:
