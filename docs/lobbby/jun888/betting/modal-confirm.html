<div
  class="bootbox modal bootbox-confirm in"
  tabindex="-1"
  role="dialog"
  aria-hidden="false"
  style="display: block"
>
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">
        <button
          type="button"
          class="bootbox-close-button close"
          data-dismiss="modal"
          aria-hidden="true"
          style="margin-top: -10px"
        >
          ×
        </button>
        <div class="bootbox-body">có chắc bạn muốn cược?</div>
      </div>
      <div class="modal-footer">
        <button data-bb-handler="cancel" type="button" class="btn btn-default">
          Cancel</button
        ><button
          data-bb-handler="confirm"
          type="button"
          class="btn btn-primary"
        >
          OK
        </button>
      </div>
    </div>
  </div>
</div>
