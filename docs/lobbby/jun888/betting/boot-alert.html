<div
  class="bootbox modal bootbox-alert in"
  tabindex="-1"
  role="dialog"
  aria-hidden="false"
  style="display: block"
>
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-body">
        <button
          type="button"
          class="bootbox-close-button close"
          data-dismiss="modal"
          aria-hidden="true"
          style="margin-top: -10px"
        >
          ×
        </button>
        <div class="bootbox-body">
          - Live Betting - Xin vui lòng chờ đợi một vài giây trong khi đặt cược
          của bạn đang được xử lý. Cảm ơn bạn! Trạng thái 'chờ' đặt cược có
          nghĩa là đang được xử lý. Tình trạng cá cược có nghĩa là 'Chạy' được
          chấp nhận.
        </div>
      </div>
      <div class="modal-footer">
        <button data-bb-handler="ok" type="button" class="btn btn-primary">
          OK
        </button>
      </div>
    </div>
  </div>
</div>
